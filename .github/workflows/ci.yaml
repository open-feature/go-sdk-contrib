name: ci

on:
  push:
   branches:
    - feature/workflows
    - main
  pull_request:
    branches:
      - main

env:
  GO_VERSION: '1.25.8'

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GOPATH: /home/runner/work/open-feature/go-sdk-contrib
      GOBIN: /home/runner/work/open-feature/go-sdk-contrib/bin
    steps:
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # tools/provider-tck embeds the conformance assets straight out of the
          # open-feature/spec submodule, so without the submodule the //go:embed
          # patterns match nothing and the package fails to compile — lint reports
          # it as a build error rather than as a missing checkout.
          submodules: recursive
      - name: Setup Environment
        run: |
          echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          echo "GOTOOLCHAIN=go${GO_VERSION}" >> $GITHUB_ENV
      - name: Module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        env:
          cache-name: go-mod-cache
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('**/go.sum') }}
      - name: Run workspace init
        run: make workspace-init
      # The provider TCK's conformance artifacts are generated from the spec
      # submodule and committed, because Go module zips exclude submodule content.
      # This fails if the committed copies have drifted from the submodule, so the
      # definition of conformance cannot be edited locally without being caught.
      - name: Check provider-tck assets are in sync with the spec submodule
        run: make provider-tck-assets-check
      - name: Run Vulncheck
        continue-on-error: true
        run: make vulncheck
      - name: Run linter
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Setup Environment
        run: |
          echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          echo "GOTOOLCHAIN=go${GO_VERSION}" >> $GITHUB_ENV
      - name: Module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        env:
          cache-name: go-mod-cache
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('**/go.sum') }}
      - name: Run workspace init
        run: make workspace-init
      - name: Run tests, including e2e
        run: make e2e
