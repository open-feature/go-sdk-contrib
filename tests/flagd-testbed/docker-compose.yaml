# The backend stack the Go provider conformance adoptions run against: the
# unmodified flagd testbed image, serving flagd and its launchpad control API.
# What each suite makes of it is in providers/flagd/tck/README.md and
# providers/ofrep/tck/README.md.
#
# One file for every adoption, so the image tag cannot drift between two suites
# whose results are only comparable if both answered the same backend. All four
# ports are published and each suite asks the harness for the subset it needs.
#
# NOT the testbed submodule's compose file, on purpose: that one bind-mounts
# ${FLAGS_DIR} -- which defaults to its own directory, so an unset value has the
# launchpad write into the checked-out submodule.
#
# The envoy sidecar is the testbed's, routing to this file's backend service;
# only the flagd adoption's @targetURI and @forbidden extension scenarios use it.
#
# Add no host port bindings; the suite requires dynamically mapped ports.
services:
  backend:
    image: ghcr.io/open-feature/flagd-testbed:v3.11.0
    ports:
      - 8013   # flagd RPC evaluation (gRPC)
      - 8015   # flagd in-process sync (gRPC)
      - 8016   # flagd's OFREP endpoint (HTTP)
      - 8080   # launchpad control API

  envoy:
    image: envoyproxy/envoy:v1.40-latest@sha256:459f2a6404c340fe6afccd69d85527012d47f3c036765493e6f8f3113fa384de
    ports:
      - 9211
      - 9212
      - 9901
    command:
      - /bin/sh
      - -c
      - |
        echo "Creating envoy config..."

        cat > /tmp/envoy.yaml << 'EOF'
        admin:
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 9901
        
        static_resources:
          listeners:
            - name: local-envoy
              address:
                socket_address:
                  address: 0.0.0.0
                  port_value: 9211
              filter_chains:
                - filters:
                    - name: envoy.filters.network.http_connection_manager
                      typed_config:
                        "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                        stat_prefix: ingress_http
                        access_log:
                          - name: envoy.access_loggers.stdout
                            typed_config:
                              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                        http_filters:
                          - name: envoy.filters.http.router
                            typed_config:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                        route_config:
                          name: local_route
                          virtual_hosts:
                            # Route for sync service
                            - name: sync-service
                              domains:
                                - "flagd-sync.service"
                                - "sync.flagd.local"
                                - "sync.service"
                              routes:
                                - match:
                                    prefix: "/"
                                    grpc: {}
                                  route:
                                    cluster: local-sync-service
                            # Route for RPC service
                            - name: rpc-service
                              domains:
                                - "flagd-rpc.service"
                                - "rpc.flagd.local"
                                - "rpc.service"
                              routes:
                                - match:
                                    prefix: "/"
                                    grpc: {}
                                  route:
                                    cluster: local-rpc-service
                            # Default catch-all
                            - name: default-service
                              domains:
                                - "*"
                              routes:
                                - match:
                                    prefix: "/"
                                    grpc: {}
                                  route:
                                    cluster: local-rpc-service
            - name: permission-denied-listener
              address:
                socket_address:
                  address: 0.0.0.0
                  port_value: 9212
              filter_chains:
                - filters:
                    - name: envoy.filters.network.http_connection_manager
                      typed_config:
                        "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                        stat_prefix: permission_denied
                        access_log:
                          - name: envoy.access_loggers.stdout
                            typed_config:
                              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                        http_filters:
                          - name: envoy.filters.http.router
                            typed_config:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                        route_config:
                          name: permission_denied_route
                          virtual_hosts:
                            - name: permission-denied
                              domains:
                                - "*"
                              routes:
                                - match:
                                    prefix: "/"
                                    grpc: {}
                                  direct_response:
                                    status: 403
                                    body:
                                      inline_string: "PERMISSION_DENIED"
          clusters:
            - name: local-sync-service
              type: LOGICAL_DNS
              dns_lookup_family: V4_ONLY
              connect_timeout: 0.25s
              http2_protocol_options: {}
              health_checks:
                - timeout: 1s
                  interval: 1s
                  unhealthy_threshold: 1
                  healthy_threshold: 1
                  tcp_health_check: {}
              load_assignment:
                cluster_name: local-sync-service
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: backend
                              port_value: 8015

            - name: local-rpc-service
              type: LOGICAL_DNS
              dns_lookup_family: V4_ONLY
              connect_timeout: 0.25s
              http2_protocol_options: {}
              health_checks:
                - timeout: 1s
                  interval: 1s
                  unhealthy_threshold: 1
                  healthy_threshold: 1
                  tcp_health_check: {}
              load_assignment:
                cluster_name: local-rpc-service
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: backend
                              port_value: 8013
        EOF

        echo "Generated config:"
        cat /tmp/envoy.yaml

        echo "Starting envoy..."
        exec envoy -c /tmp/envoy.yaml --log-level debug
    depends_on:
      - backend
